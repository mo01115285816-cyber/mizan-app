name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mizan Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout the exact repository commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle from the repository wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages required by this project
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"

      - name: Provide build-time configuration
        shell: bash
        run: |
          test -f .env.example
          cp .env.example .env
          chmod 600 .env

      - name: Prepare stable debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ] && [ -n "$DEBUG_KEYSTORE_PASSWORD" ] && [ -n "$DEBUG_KEY_ALIAS" ] && [ -n "$DEBUG_KEY_PASSWORD" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/debug.keystore"
            chmod 600 "$GITHUB_WORKSPACE/debug.keystore"
            {
              echo "DEBUG_KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore"
              echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
              echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
              echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
            chmod 600 debug.keystore
          fi

      - name: Build Debug APK from the uploaded source
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify Debug APK output
        shell: bash
        run: |
          found=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -s "$apk"
            sha256sum "$apk"
            found=1
          done
          test "$found" = 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        if: env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/my-upload-key.jks"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Release APK and AAB
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Upload signed Release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mizan-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Release AAB
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mizan-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mizan Android build"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Debug APK: built and uploaded when the build job succeeds."
            if [ "$HAS_RELEASE_SIGNING" = 'true' ]; then
              echo "- Release APK/AAB: signed build requested and uploaded when successful."
            else
              echo "- Release APK/AAB: skipped because signing secrets are not configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
